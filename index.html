<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}*{box-sizing:border-box}</style>
<title>Наше меню</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Manrope:wght@400;500;700;800&display=swap">
<style>
  /* Layout: one narrow column like a note on the fridge — a header with the week's dates, then seven day cards; today's card is open and marked. */
  :root {
    --bg: #f3f5ee;
    --card: #ffffff;
    --fg: #23281f;
    --muted: #6b7363;
    --line: #dfe4d6;
    --accent: #b4325a;
    --accent-soft: #f8e3ea;
    --herb: #4f6b3a;
    --herb-soft: #e6eedc;
    --cat: #f2c48d;
    --cat-line: #6b4a2e;
    --font-hand: "Caveat", "Segoe Print", cursive;
    --font-body: "Manrope", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171a15; --card: #20241d; --fg: #eef1e8; --muted: #a2ab98; --line: #333a2d;
      --accent: #f07a9c; --accent-soft: #3a2029; --herb: #a9c78e; --herb-soft: #26301f;
      --cat: #e0aa72; --cat-line: #3b2716;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #171a15; --card: #20241d; --fg: #eef1e8; --muted: #a2ab98; --line: #333a2d;
    --accent: #f07a9c; --accent-soft: #3a2029; --herb: #a9c78e; --herb-soft: #26301f;
    --cat: #e0aa72; --cat-line: #3b2716;
    color-scheme: dark;
  }

  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
  .wrap {
    max-width: 560px; margin: 0 auto;
    padding-block: 28px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid; gap: 20px;
  }

  header { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 12px; }
  .htext { display: grid; gap: 4px; min-width: 0; }
  .cat { width: 96px; height: auto; flex: none; }
  .tail { transform-origin: 88px 88px; animation: wag 2.4s ease-in-out infinite; }
  @keyframes wag { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-14deg); } }
  .hello { font-family: var(--font-hand); font-size: 1.7rem; color: var(--accent); line-height: 1.1; }
  h1 { margin: 0; font-size: 1.9rem; font-weight: 800; letter-spacing: -0.02em; text-wrap: balance; }
  .range { color: var(--muted); font-weight: 500; }

  .days { display: grid; gap: 12px; }
  details.day {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    overflow: hidden;
  }
  details.day.today { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  summary {
    list-style: none; cursor: pointer;
    display: flex; align-items: baseline; gap: 10px;
    padding: 14px 16px;
  }
  summary::-webkit-details-marker { display: none; }
  summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 16px; }
  .dname { font-weight: 800; font-size: 1.1rem; }
  .ddate { color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
  .badge {
    margin-left: auto; align-self: center;
    font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
    background: var(--accent); color: var(--card); padding: 3px 9px; border-radius: 999px;
  }
  .chev { margin-left: auto; align-self: center; color: var(--muted); transition: transform .2s; }
  .today .chev { margin-left: 8px; }
  details[open] .chev { transform: rotate(180deg); }

  .meals { display: grid; gap: 0; padding: 0 16px 8px; }
  .meal { display: grid; grid-template-columns: 74px 1fr; gap: 12px; padding: 12px 0; border-top: 1px dashed var(--line); }
  .mlabel {
    font-size: 0.74rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--herb); padding-top: 3px;
  }
  .mtext { min-width: 0; }

  footer { text-align: center; font-family: var(--font-hand); font-size: 1.4rem; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) { .chev { transition: none; } .tail { animation: none; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="htext">
      <div class="hello">Наше меню</div>
      <h1>Что готовим на неделе</h1>
      <div class="range" id="range"></div>
    </div>
    <svg class="cat" viewBox="0 0 120 104" role="img" aria-label="Котик">
      <path class="tail" d="M88 88 C112 86 114 60 102 52" fill="none" stroke="var(--cat-line)" stroke-width="9" stroke-linecap="round"/>
      <path class="tail" d="M88 88 C112 86 114 60 102 52" fill="none" stroke="var(--cat)" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="60" cy="80" rx="31" ry="21" fill="var(--cat)" stroke="var(--cat-line)" stroke-width="2.5"/>
      <polygon points="37,32 35,7 56,22" fill="var(--cat)" stroke="var(--cat-line)" stroke-width="2.5" stroke-linejoin="round"/>
      <polygon points="83,32 85,7 64,22" fill="var(--cat)" stroke="var(--cat-line)" stroke-width="2.5" stroke-linejoin="round"/>
      <polygon points="40,27 39,14 50,22" fill="var(--accent-soft)"/>
      <polygon points="80,27 81,14 70,22" fill="var(--accent-soft)"/>
      <circle cx="60" cy="45" r="26" fill="var(--cat)" stroke="var(--cat-line)" stroke-width="2.5"/>
      <path d="M45 44 q5 -6 10 0 M65 44 q5 -6 10 0" fill="none" stroke="var(--cat-line)" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="44" cy="53" r="4.5" fill="var(--accent)" opacity=".28"/>
      <circle cx="76" cy="53" r="4.5" fill="var(--accent)" opacity=".28"/>
      <path d="M57 50 h6 l-3 3.5 z" fill="var(--accent)"/>
      <path d="M54 56 q3 3 6 0 q3 3 6 0" fill="none" stroke="var(--cat-line)" stroke-width="2" stroke-linecap="round"/>
      <path d="M38 50 l-12 -2 M38 55 l-12 2 M82 50 l12 -2 M82 55 l12 2" stroke="var(--cat-line)" stroke-width="1.6" stroke-linecap="round"/>
      <ellipse cx="49" cy="99" rx="8" ry="5" fill="var(--cat)" stroke="var(--cat-line)" stroke-width="2.5"/>
      <ellipse cx="71" cy="99" rx="8" ry="5" fill="var(--cat)" stroke="var(--cat-line)" stroke-width="2.5"/>
    </svg>
  </header>

  <main class="days" id="days"></main>

  <footer>Приятного аппетита!</footer>
</div>

<script>
  // ===== Edit only this block each week =====
  const WEEK_START = "2026-11-23"; // Monday, YYYY-MM-DD
  const MENU = [
    ["Горячие бутерброды с ветчиной, сыром и помидорами.",
     "Жареная картошка с грибами и луком, солёные огурчики.",
     "Куриные рулетики в лаваше с овощами и сыром."],
    ["Овсяная каша с бананом и шоколадом.",
     "Суп с фрикадельками, картофелем и вермишелью, чесночные гренки.",
     "Горячие бутерброды с моцареллой и помидорами на сковороде."],
    ["Блинчики с творогом или вареньем.",
     "Салат «Цезарь» с курицей, черри, сухариками, пармезаном и соусом.",
     "Блины с мясным фаршем, луком и сметаной."],
    ["Тосты с творожным сыром, огурцом и ветчиной.",
     "Спагетти с курицей и грибами в сливочном соусе.",
     "Плов."],
    ["Рисовая каша на молоке с ягодами.",
     "Гречка с фрикадельками в томатно-сметанной подливке, овощной салат.",
     "Жареные картофельные дольки с курицей и сырным соусом."],
    ["Горячие сэндвичи с ветчиной и сыром.",
     "Поке с рисом, курицей терияки, авокадо, огурцом, морковью и кунжутом.",
     "Домашние панини с ветчиной, сыром, айсбергом, помидорами и солёным огурчиком на сковороде."],
    ["Панкейки с бананом и шоколадной пастой.",
     "Домашняя шаурма с курицей, овощами и чесночным соусом.",
     "Мини-пиццы на тортильях с ветчиной, грибами и сыром на сковороде."]
  ];
  // ===========================================

  const DAY_NAMES = ["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"];
  const MEAL_NAMES = ["Завтрак","Обед","Ужин"];
  const MONTHS = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];

  const [y, m, d] = WEEK_START.split("-").map(Number);
  const start = new Date(y, m - 1, d);
  const dayDate = i => new Date(y, m - 1, d + i);
  const fmt = dt => dt.getDate() + " " + MONTHS[dt.getMonth()];

  const end = dayDate(6);
  document.getElementById("range").textContent =
    start.getMonth() === end.getMonth()
      ? start.getDate() + "–" + fmt(end)
      : fmt(start) + " – " + fmt(end);

  const now = new Date();
  const todayKey = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  let todayIndex = -1;
  for (let i = 0; i < 7; i++) if (dayDate(i).getTime() === todayKey) todayIndex = i;
  const openIndex = todayIndex >= 0 ? todayIndex : 0;

  const esc = s => s.replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
  document.getElementById("days").innerHTML = MENU.map((meals, i) => `
    <details class="day${i === todayIndex ? " today" : ""}"${i === openIndex ? " open" : ""}>
      <summary>
        <span class="dname">${DAY_NAMES[i]}</span>
        <span class="ddate">${fmt(dayDate(i))}</span>
        ${i === todayIndex ? '<span class="badge">сегодня</span>' : ""}
        <span class="chev" aria-hidden="true">▾</span>
      </summary>
      <div class="meals">
        ${meals.map((t, j) => `
          <div class="meal"><div class="mlabel">${MEAL_NAMES[j]}</div><div class="mtext">${esc(t)}</div></div>
        `).join("")}
      </div>
    </details>
  `).join("");
</script>
</body>
</html>
